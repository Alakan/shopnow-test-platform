services:

  shopnow:
    build: ./app
    container_name: shopnow-app
    ports:
      - "8081:8080"
    environment:
      PORT: 8080
    restart: unless-stopped

  sonardb:
    image: postgres:16
    container_name: sonardb
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    volumes:
      - sonardb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    depends_on:
      sonardb:
        condition: service_healthy
    command: >
      bash -c "
        until (echo > /dev/tcp/sonardb/5432) >/dev/null 2>&1; do
          echo 'Waiting for PostgreSQL on sonardb:5432...';
          sleep 2;
        done;
        echo 'PostgreSQL reachable; starting SonarQube';
        exec /opt/sonarqube/docker/entrypoint.sh
      "
    ports:
      - "9090:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonardb:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped

  jenkins:
    build: ./jenkins
    extra_hosts:
      - "github.com:140.82.121.4"
    container_name: jenkins
    user: root
    privileged: true
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  sonardb_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  jenkins_home: